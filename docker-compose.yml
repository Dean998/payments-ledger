name: payments-ledger

x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    LOG_LEVEL: info
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ['54320:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: ['pgdata:/var/lib/postgresql']

  migrate:
    build: .
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/main.js']
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      retries: 10

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    ports: ['9464:9464']

  webhook-sink:
    build: .
    command: ['node', 'dist/dev/webhook-sink.js']
    environment:
      WEBHOOK_SECRET: whsec_ZGVtby1zZWNyZXQtZm9yLWxvY2FsLWRldmVsb3BtZW50
    ports: ['4000:4000']

volumes:
  pgdata:
